<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="400" height="260" role="img" aria-label="Computer hardware RAM and SSD solid state storage illustration">
  <defs>
    <linearGradient id="ssdGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="ramGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16a34a" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>
  </defs>
  <rect x="10" y="10" width="380" height="240" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2" />
  
  <!-- SSD Drive -->
  <rect x="50" y="60" width="140" height="150" rx="10" fill="url(#ssdGrad)" stroke="#64748b" stroke-width="2" />
  <rect x="65" y="80" width="110" height="70" rx="4" fill="#0f172a" />
  <text x="120" y="115" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="bold" fill="#38bdf8" text-anchor="middle">FAST SSD</text>
  <text x="120" y="132" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">NVMe / SATA 3.0</text>
  
  <!-- SSD Pins -->
  <rect x="80" y="200" width="30" height="10" fill="#f59e0b" />
  <rect x="120" y="200" width="50" height="10" fill="#f59e0b" />
  
  <!-- RAM Stick -->
  <rect x="220" y="70" width="130" height="50" rx="4" fill="url(#ramGrad)" stroke="#166534" stroke-width="2" />
  <!-- RAM Chips -->
  <rect x="230" y="80" width="18" height="22" rx="2" fill="#0f172a" />
  <rect x="255" y="80" width="18" height="22" rx="2" fill="#0f172a" />
  <rect x="280" y="80" width="18" height="22" rx="2" fill="#0f172a" />
  <rect x="305" y="80" width="18" height="22" rx="2" fill="#0f172a" />
  <!-- RAM Pins -->
  <g fill="#f59e0b">
    <rect x="225" y="118" width="85" height="4" />
    <rect x="315" y="118" width="30" height="4" />
  </g>
  <text x="285" y="150" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="700" fill="#1e293b" text-anchor="middle">DDR4 / DDR5 RAM</text>
  <text x="285" y="170" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">High Performance Memory</text>
</svg>
