<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 48" width="200" height="48" role="img" aria-label="Wastechnology Logo">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>
  <!-- Modern Chip/Tech Icon -->
  <rect x="4" y="6" width="36" height="36" rx="8" fill="url(#logoGrad)" />
  <rect x="12" y="14" width="20" height="20" rx="4" fill="#ffffff" />
  <path d="M16 22 L20 28 L28 18" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Circuit pins -->
  <line x1="2" y1="18" x2="4" y2="18" stroke="#2563eb" stroke-width="2" stroke-linecap="round" />
  <line x1="2" y1="30" x2="4" y2="30" stroke="#2563eb" stroke-width="2" stroke-linecap="round" />
  <line x1="40" y1="18" x2="42" y2="18" stroke="#2563eb" stroke-width="2" stroke-linecap="round" />
  <line x1="40" y1="30" x2="42" y2="30" stroke="#2563eb" stroke-width="2" stroke-linecap="round" />
  <!-- Text -->
  <text x="48" y="30" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="20" font-weight="800" fill="#0f172a">Wastech<tspan fill="#2563eb">nology</tspan></text>
</svg>
