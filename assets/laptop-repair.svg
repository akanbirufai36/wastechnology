<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="400" height="260" role="img" aria-label="Laptop hardware diagnostic and repair illustration">
  <defs>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
  </defs>
  <!-- Background Shape -->
  <rect x="10" y="10" width="380" height="240" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2" />
  
  <!-- Laptop Screen Lid -->
  <rect x="90" y="45" width="220" height="130" rx="8" fill="url(#screenGrad)" stroke="#cbd5e1" stroke-width="2" />
  <rect x="102" y="57" width="196" height="106" rx="4" fill="#0f172a" />
  
  <!-- Screen Graphic (Code & Diagnostics) -->
  <line x1="115" y1="75" x2="160" y2="75" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />
  <line x1="115" y1="90" x2="210" y2="90" stroke="#4ade80" stroke-width="3" stroke-linecap="round" />
  <line x1="115" y1="102" x2="185" y2="102" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
  <line x1="115" y1="114" x2="230" y2="114" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
  <circle cx="260" cy="85" r="14" fill="#2563eb" opacity="0.3" />
  <path d="M254 85 L258 89 L267 80" fill="none" stroke="#60a5fa" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Laptop Base / Keyboard Deck -->
  <polygon points="65,175 335,175 350,195 50,195" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2" />
  <rect x="165" y="180" width="70" height="10" rx="3" fill="#cbd5e1" />
  
  <!-- Screwdriver Tool -->
  <g transform="translate(290, 70) rotate(45)">
    <rect x="-8" y="-40" width="16" height="40" rx="4" fill="url(#blueGlow)" />
    <rect x="-3" y="0" width="6" height="50" fill="#94a3b8" />
    <polygon points="-4,50 4,50 1,60 -1,60" fill="#64748b" />
  </g>
</svg>
